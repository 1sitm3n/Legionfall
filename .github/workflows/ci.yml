name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Release build + tests on both architectures. ARM matters here: the deque's
  # memory ordering is only really exercised on a weak memory model, and an
  # x86-only pipeline would pass happily with the fences missing.
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: "linux x86-64 / gcc" }
          - { os: macos-14,       name: "macos arm64 / clang" }
          # MSVC has no inline asm on x64 or ARM64, so the spin hint has to go
          # through intrinsics. This leg is what catches that.
          - { os: windows-latest, name: "windows x86-64 / msvc" }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Simulation smoke test
        if: runner.os != 'Windows'
        run: ./build/lf_playtest 20000 --frames 120

      # No cross-enemy dependency in the enemy update, so chunking the range
      # differently must not change a single float.
      - name: Parallel path matches sequential bit-for-bit
        if: runner.os != 'Windows'
        run: ./tools/check_determinism.sh ./build/lf_playtest

      - name: Benchmark
        if: runner.os != 'Windows'
        run: ./build/lf_bench

      # Multi-config generator, so the binary lands in build/Release.
      - name: Benchmark (Windows)
        if: runner.os == 'Windows'
        run: .\build\Release\lf_bench.exe

  sanitizers:
    name: ${{ matrix.san }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        san: [LF_ASAN, LF_TSAN]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -D${{ matrix.san }}=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Builds with the pop() fence downgraded to relaxed and sees whether the
  # duplication test notices.
  #
  # Non-blocking on purpose. The race is probabilistic and depends on how much
  # real parallelism the machine has: roughly 1 run in 20 on an idle M3, more
  # under load, and 0 in 25 on a 3-core CI runner. Gating the build on it would
  # produce a red main for environmental reasons, which is how people learn to
  # ignore CI. The fence is justified by the memory model, not by this job -
  # this is a spot-check that sometimes catches a regression, and it reports
  # either way.
  fence-canary:
    name: fence canary (informational)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure with the fence broken
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLF_BREAK_POP_FENCE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Does the duplication test still notice?
        run: |
          for i in $(seq 1 60); do
            if ! ./build/lf_tests deque_steal_no_duplication > /dev/null 2>&1; then
              echo "Caught the missing fence on run $i of 60."
              exit 0
            fi
          done
          echo "60 runs, not caught on this runner."
          echo "Expected on a small VM - see the note in ci.yml. Reproduce locally:"
          echo "  cmake -S . -B b -DLF_BREAK_POP_FENCE=ON && cmake --build b"
          echo "  ./b/lf_tests deque_steal_no_duplication"
          exit 1
